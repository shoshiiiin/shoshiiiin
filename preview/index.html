<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile preview</title>
<style>
  /* Mimics the GitHub profile README column so the SVGs are judged at their real size. */
  :root { color-scheme: dark; }
  body { margin: 0; background: #0d1117; color: #e6edf3; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body.light { background: #ffffff; color: #1f2328; }
  main { max-width: 830px; margin: 24px auto; padding: 24px; border: 1px solid #30363d; border-radius: 6px; }
  body.light main { border-color: #d0d7de; }
  img { max-width: 100%; }
  /* GitHub's markdown styles for the parts the README uses: headings, links, tables. */
  h3 { font-size: 1.25em; font-weight: 600; margin: 24px 0 16px; }
  a { color: #4493f8; text-decoration: none; }
  body.light a { color: #0969da; }
  table { border-collapse: collapse; margin: 0 auto 16px; }
  th, td { padding: 6px 13px; border: 1px solid #3d444d; }
  th { font-weight: 600; }
  tr:nth-child(2n) { background: #151b23; }
  body.light th, body.light td { border-color: #d1d9e0; }
  body.light tr:nth-child(2n) { background: #f6f8fa; }
  code { font: 85% ui-monospace, SFMono-Regular, Menlo, monospace; padding: .2em .4em; border-radius: 6px; background: #656c7633; }
  sub { color: #9198a1; }
  .center { text-align: center; }
  button { position: fixed; top: 8px; right: 8px; }
</style>
</head>
<body>
<button type="button" onclick="document.body.classList.toggle('light')">Light / Dark</button>
<main id="readme">Loading README…</main>
<script type="module">
  // Renders README.md roughly like GitHub: the README is mostly HTML already.
  const md = await (await fetch('../README.md', { cache: 'no-store' })).text();
  const html = md
    .replace(/^### (.*)$/gm, '<h3>$1</h3>')
    .replace(/^## (.*)$/gm, '<h2>$1</h2>')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/src="\.\//g, 'src="../');
  document.getElementById('readme').innerHTML = html;
</script>
</body>
</html>
